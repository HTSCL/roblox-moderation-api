<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAFF - PANEL CONFIDENTIEL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gotham', 'Arial', sans-serif;
            background: linear-gradient(180deg, #3498db 0%, #2980b9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-container {
            background: rgba(26, 26, 26, 0.95);
            border: 3px solid #2a2a2a;
            border-radius: 20px;
            width: 100%;
            max-width: 1400px;
            height: 850px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding: 25px 35px;
            border-bottom: 3px solid #f4e04d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-icon {
            width: 45px;
            height: 45px;
            background: #f4e04d;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .header-icon:hover {
            transform: scale(1.1);
            background: #fff;
        }

        .header-title {
            color: #f4e04d;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            flex: 1;
        }

        .close-btn {
            background: #f4e04d;
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #fff;
            transform: rotate(90deg);
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            background: #0a0a0a;
            border-right: 3px solid #f4e04d;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .search-container {
            margin-bottom: 15px;
        }

        .search-label {
            color: #8b8b8b;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }

        .search-box {
            width: 100%;
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            color: #4dd9f4;
            font-size: 15px;
            outline: none;
        }

        .search-box::placeholder {
            color: #4a4a4a;
        }

        .player-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            color: #4dd9f4;
            font-size: 14px;
        }

        .player-dot {
            width: 8px;
            height: 8px;
            background: #4dd9f4;
            border-radius: 50%;
        }

        .api-key-box {
            background: #1a1a1a;
            border: 2px solid #f4e04d;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .api-key-box h3 {
            color: #f4e04d;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .api-key-box input {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
        }

        .server-status {
            margin-top: auto;
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            padding: 15px;
        }

        .server-status h3 {
            color: #f4e04d;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .server-item {
            background: #0a0a0a;
            border-left: 3px solid #4dd9f4;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .server-item p {
            color: #aaa;
            font-size: 12px;
            margin: 3px 0;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs-container {
            background: #1a1a1a;
            padding: 15px 20px;
            border-bottom: 2px solid #2a2a2a;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab {
            background: #f4e04d;
            color: #000;
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .tab:hover {
            background: #fff;
            transform: translateY(-2px);
        }

        .tab.active {
            background: #fff;
            box-shadow: 0 4px 12px rgba(244, 224, 77, 0.4);
        }

        .tab-content {
            display: none;
            padding: 25px;
            flex: 1;
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content::-webkit-scrollbar {
            width: 8px;
        }

        .tab-content::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .tab-content::-webkit-scrollbar-thumb {
            background: #f4e04d;
            border-radius: 4px;
        }

        .form-section {
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-row {
            margin-bottom: 15px;
        }

        .form-label {
            color: #8b8b8b;
            font-size: 13px;
            margin-bottom: 6px;
            display: block;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: #0a0a0a;
            border: 2px solid #2a2a2a;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .form-input::placeholder, .form-textarea::placeholder {
            color: #4a4a4a;
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .duration-inputs {
            display: flex;
            gap: 10px;
        }

        .duration-inputs input {
            flex: 1;
        }

        .ban-type-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .ban-type-btn {
            flex: 1;
            background: #000;
            color: #f4e04d;
            border: 2px solid #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .ban-type-btn.active {
            background: #f4e04d;
            color: #000;
        }

        .reasons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }

        .reason-btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .reason-btn:hover {
            background: #3a3a3a;
            border-left: 3px solid #f4e04d;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .action-btn {
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .action-btn.note {
            background: #4dd9f4;
            color: #000;
        }

        .action-btn.warn {
            background: #f4e04d;
            color: #000;
        }

        .action-btn.kick {
            background: #ff9966;
            color: #000;
        }

        .action-btn.ban {
            background: #ff4444;
            color: #fff;
        }

        .action-btn.ban-cheater {
            background: #ff4444;
            color: #fff;
        }

        .action-btn.tool {
            background: #2a2a2a;
            color: #fff;
            border: 2px solid #4dd9f4;
        }

        .action-btn.tool:hover {
            background: #4dd9f4;
            color: #000;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 2px solid #f4e04d;
            border-radius: 10px;
            padding: 20px;
            color: #fff;
            min-width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
            z-index: 9999;
        }

        .notification.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        .notification.error {
            border-color: #ff4444;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <div class="header-left">
                <div class="header-icon">✓</div>
                <div class="header-icon">🏠</div>
                <div class="header-icon">⚙</div>
            </div>
            <div class="header-title">STAFF - PANEL CONFIDENTIEL</div>
            <button class="close-btn" onclick="window.close()">X</button>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="search-container">
                    <label class="search-label">Entrez un pseudo roblox...</label>
                    <input type="text" class="search-box" id="playerSearch" placeholder="">
                    <div class="player-indicator">
                        <span class="player-dot"></span>
                        <span id="playerName">(!) lucassss_2</span>
                    </div>
                </div>

                <div class="api-key-box">
                    <h3>🔑 Clé API</h3>
                    <input type="password" id="apiKey" placeholder="Entrez votre clé secrète">
                </div>

                <div class="server-status">
                    <h3>🖥️ Serveurs Actifs</h3>
                    <div id="serverList">
                        <div class="server-item">
                            <p><strong>En attente...</strong></p>
                            <p>Aucun serveur connecté</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="content-area">
                <div class="tabs-container">
                    <button class="tab active" data-tab="sanctions">SANCTIONS</button>
                    <button class="tab" data-tab="outils">OUTILS</button>
                    <button class="tab" data-tab="satp">SA / TP</button>
                    <button class="tab" data-tab="bancheater">BAN CHEATER</button>
                </div>

                <!-- Tab Sanctions -->
                <div class="tab-content active" id="sanctions">
                    <div class="form-section">
                        <div class="form-row">
                            <label class="form-label">Entrez une ou plusieurs raisons valides...</label>
                            <textarea class="form-textarea" id="sanction-reason" placeholder=""></textarea>
                        </div>

                        <div class="reasons-grid">
                            <button class="reason-btn" onclick="addReason('Perm : 10 avertissements (3 derniers mois)')">Perm : 10 avertissements (3 derniers mois)</button>
                            <button class="reason-btn" onclick="addReason('3 avertissements actifs')">3 avertissements actifs</button>
                            <button class="reason-btn" onclick="addReason('5 avertissements actifs')">5 avertissements actifs</button>
                            <button class="reason-btn" onclick="addReason('Perm : 7 avertissements actifs')">Perm : 7 avertissements actifs</button>
                            <button class="reason-btn" onclick="addReason('Abus du name RP')">Abus du name RP</button>
                            <button class="reason-btn" onclick="addReason('Abus/insulte ticket admin')">Abus/insulte ticket admin</button>
                            <button class="reason-btn" onclick="addReason('AFK/AFK Farm')">AFK/AFK Farm</button>
                            <button class="reason-btn" onclick="addReason('Arnaque/Vente IRL')">Arnaque/Vente IRL</button>
                            <button class="reason-btn" onclick="addReason('Auto event')">Auto event</button>
                            <button class="reason-btn" onclick="addReason('Bannissement définitif (en attente de validation)')">Bannissement définitif (en attente de validation)</button>
                            <button class="reason-btn" onclick="addReason('Bunny-Hop/Jump shoot')">Bunny-Hop/Jump shoot</button>
                            <button class="reason-btn" onclick="addReason('CDS (compte main)')">CDS (compte main)</button>
                            <button class="reason-btn" onclick="addReason('Perm : CDS (double compte)')">Perm : CDS (double compte)</button>
                            <button class="reason-btn" onclick="addReason('Déconnexion en inter-admin')">Déconnexion en inter-admin</button>
                            <button class="reason-btn" onclick="addReason('Déconnexion en scène RP')">Déconnexion en scène RP</button>
                            <button class="reason-btn" onclick="addReason('Perm : ERP')">Perm : ERP</button>
                            <button class="reason-btn" onclick="addReason('Erreur RP (lourd/récidive)')">Erreur RP (lourd/récidive)</button>
                            <button class="reason-btn" onclick="addReason('Erreur RP (léger)')">Erreur RP (léger)</button>
                            <button class="reason-btn" onclick="addReason('Erreur RP (medium)')">Erreur RP (medium)</button>
                            <button class="reason-btn" onclick="addReason('Fear/Pain (récidive)')">Fear/Pain (récidive)</button>
                            <button class="reason-btn" onclick="addReason('Fear/Pain RP')">Fear/Pain RP</button>
                            <button class="reason-btn" onclick="addReason('Force RP')">Force RP</button>
                            <button class="reason-btn" onclick="addReason('Free arrest')">Free arrest</button>
                            <button class="reason-btn" onclick="addReason('Freekill')">Freekill</button>
                            <button class="reason-btn" onclick="addReason('Freekill (lourd)')">Freekill (lourd)</button>
                        </div>

                        <div class="ban-type-btns" id="banTypeContainer" style="display: none;">
                            <button class="ban-type-btn" id="permanentBtn">Permanent</button>
                            <button class="ban-type-btn active" id="temporaryBtn">Temporaire</button>
                        </div>

                        <div class="form-row" id="durationContainer" style="display: none;">
                            <label class="form-label">Durée</label>
                            <div class="duration-inputs">
                                <input type="number" class="form-input" id="sanction-days" placeholder="Jour(s)" min="0">
                                <input type="number" class="form-input" id="sanction-hours" placeholder="Heure(s)" min="0">
                                <input type="number" class="form-input" id="sanction-minutes" placeholder="Min(s)" min="0">
                            </div>
                        </div>

                        <div class="form-row">
                            <label class="form-label">Votre nom (modérateur)</label>
                            <input type="text" class="form-input" id="sanction-moderator" placeholder="">
                        </div>

                        <div class="action-buttons">
                            <button class="action-btn note" onclick="executeSanction('note')">Note</button>
                            <button class="action-btn warn" onclick="executeSanction('warn')">Warn</button>
                            <button class="action-btn kick" onclick="executeSanction('kick')">Kick</button>
                            <button class="action-btn ban" onclick="showBanOptions()">Bannir</button>
                        </div>
                    </div>
                </div>

                <!-- Tab Outils -->
                <div class="tab-content" id="outils">
                    <div class="action-buttons">
                        <button class="action-btn tool" onclick="executePlayerAction('inventory')">Inventaire</button>
                        <button class="action-btn tool" onclick="executePlayerAction('respawn')">Respawn</button>
                        <button class="action-btn tool" onclick="executePlayerAction('refresh')">Refresh</button>
                        <button class="action-btn tool" onclick="executePlayerAction('freeze')">Freeze</button>
                        <button class="action-btn tool" onclick="executePlayerAction('jail')">Jail</button>
                        <button class="action-btn tool" onclick="toggleView()">View</button>
                        <button class="action-btn tool" onclick="executePlayerAction('god')">God</button>
                        <button class="action-btn tool" onclick="executePlayerAction('heal')">Heal</button>
                        <button class="action-btn tool" onclick="executePlayerAction('bring')">Bring</button>
                        <button class="action-btn tool" onclick="executePlayerAction('goto')">Goto</button>
                        <button class="action-btn ban" onclick="executePlayerAction('kill')">Kill</button>
                        <button class="action-btn tool" onclick="showMessageDialog()">Message (alerte admin)</button>
                    </div>
                </div>

                <!-- Tab SA/TP -->
                <div class="tab-content" id="satp">
                    <h2 style="color: #f4e04d; margin-bottom: 20px;">Salles & Téléportation</h2>
                    <p style="color: #aaa;">Fonctionnalité à venir...</p>
                </div>

                <!-- Tab Ban Cheater -->
                <div class="tab-content" id="bancheater">
                    <div class="form-section">
                        <div class="form-row">
                            <label class="form-label">Joueur à bannir pour triche</label>
                            <input type="text" class="form-input" id="cheater-username" placeholder="Nom du joueur">
                        </div>

                        <div class="action-buttons">
                            <button class="action-btn ban-cheater" onclick="banCheater()">BAN CHEATER (7 jours validation)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <p id="notification-text"></p>
    </div>

    <script>
        const API_URL = window.location.origin;
        let isPermanentBan = false;

        // Gestion des tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // Notification
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const text = document.getElementById('notification-text');
            text.textContent = message;
            notification.className = `notification ${type} show`;
            setTimeout(() => notification.classList.remove('show'), 5000);
        }

        // Récupérer la clé API
        function getApiKey() {
            const key = document.getElementById('apiKey').value;
            if (!key) {
                showNotification('Veuillez entrer votre clé API', 'error');
                return null;
            }
            return key;
        }

        // Ajouter une raison
        function addReason(reason) {
            const textarea = document.getElementById('sanction-reason');
            if (textarea.value) {
                textarea.value += ', ' + reason;
            } else {
                textarea.value = reason;
            }
        }

        // Afficher les options de ban
        function showBanOptions() {
            document.getElementById('banTypeContainer').style.display = 'flex';
            document.getElementById('durationContainer').style.display = 'block';
        }

        // Gestion ban permanent/temporaire
        document.getElementById('permanentBtn')?.addEventListener('click', function() {
            isPermanentBan = true;
            this.classList.add('active');
            document.getElementById('temporaryBtn').classList.remove('active');
            document.getElementById('durationContainer').style.display = 'none';
        });

        document.getElementById('temporaryBtn')?.addEventListener('click', function() {
            isPermanentBan = false;
            this.classList.add('active');
            document.getElementById('permanentBtn').classList.remove('active');
            document.getElementById('durationContainer').style.display = 'block';
        });

        // Exécuter une sanction
        async function executeSanction(action) {
            const apiKey = getApiKey();
            if (!apiKey) return;

            const username = document.getElementById('playerSearch').value;
            const reason = document.getElementById('sanction-reason').value;
            const moderator = document.getElementById('sanction-moderator').value;

            if (!username || !reason || !moderator) {
                showNotification('Veuillez remplir tous les champs requis', 'error');
                return;
            }

            const data = { username, reason, modreason: reason, moderator, apiKey };

            if (action === 'ban') {
                const days = parseInt(document.getElementById('sanction-days').value) || 0;
                const hours = parseInt(document.getElementById('sanction-hours').value) || 0;
                const minutes = parseInt(document.getElementById('sanction-minutes').value) || 0;
                
                let duration = (days * 86400) + (hours * 3600) + (minutes * 60);
                
                if (isPermanentBan) {
                    duration = 31536000; // 365 jours
                } else if (duration === 0) {
                    showNotification('Veuillez spécifier une durée pour le ban', 'error');
                    return;
                }
                
                data.duration = duration;
            }

            try {
                const response = await fetch(`${API_URL}/api/moderation/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification(`Action ${action} exécutée avec succès !`, 'success');
                    document.getElementById('sanction-reason').value = '';
                    if (action === 'ban') {
                        document.getElementById('sanction-days').value = '';
                        document.getElementById('sanction-hours').value = '';
                        document.getElementById('sanction-minutes').value = '';
                        document.getElementById('banTypeContainer').style.display = 'none';
                        document.getElementById('durationContainer').style.display = 'none';
                    }
                } else {
                    showNotification(`Erreur: ${result.message}`, 'error');
                }
            } catch (error) {
                showNotification(`Erreur réseau: ${error.message}`, 'error');
            }
        }

        // Exécuter une action joueur
        async function executePlayerAction(action) {
            const apiKey = getApiKey();
            if (!apiKey) return;

            const targetPlayer = document.getElementById('playerSearch').value;
            
            if (!targetPlayer) {
                showNotification('Veuillez entrer le nom du joueur cible', 'error');
                return;
            }

            const data = { targetPlayer, apiKey };

            if (['bring', 'goto'].includes(action)) {
                const moderator = document.getElementById('sanction-moderator').value;
                if (!moderator) {
                    showNotification('Cette action nécessite votre nom de modérateur', 'error');
                    return;
                }
                data.moderator = moderator;
            }

            try {
                const response = await fetch(`${API_URL}/api/player/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification(`Action ${action} exécutée avec succès !`, 'success');
                } else {
                    showNotification(`Erreur: ${result.message}`, 'error');
                }
            } catch (error) {
                showNotification(`Erreur réseau: ${error.message}`, 'error');
            }
        }

        // Ban cheater
        async function banCheater() {
            const apiKey = getApiKey();
            if (!apiKey) return;

            const username = document.getElementById('cheater-username').value;
            
            if (!username) {
                showNotification('Veuillez entrer le nom du joueur', 'error');
                return;
            }

            const data = {
                username,
                reason: 'Un bannissement définitif en attente de validation à été placé sur votre compte.',
                modreason: 'Ban perm en attente de validation (ban cheater staff)',
                duration: 604800, // 7 jours
                moderator: document.getElementById('sanction-moderator').value || 'System',
                apiKey
            };

            try {
                const response = await fetch(`${API_URL}/api/moderation/ban`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification('Joueur banni pour 7 jours (validation)', 'success');
                    document.getElementById('cheater-username').value = '';
                } else {
                    showNotification(`Erreur: ${result.message}`, 'error');
                }
            } catch (error) {
                showNotification(`Erreur réseau: ${error.message}`, 'error');
            }
        }

        // Message dialog
        function showMessageDialog() {
            const targetPlayer = document.getElementById('playerSearch').value;
            if (!targetPlayer) {
                showNotification('Veuillez entrer le nom du joueur cible', 'error');
                return;
            }
            
            const message = prompt('Entrez votre message:');
            if (message) {
                sendMessage(targetPlayer, message);
            }
        }

        async function sendMessage(targetPlayer, message) {
            const apiKey = getApiKey();
            if (!apiKey) return;

            const moderator = document.getElementById('sanction-moderator').value;
            if (!moderator) {
                showNotification('Veuillez entrer votre nom de modérateur', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/player/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ targetPlayer, message, moderator, apiKey })
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification('Message envoyé avec succès !', 'success');
                } else {
                    showNotification(`Erreur: ${result.message}`, 'error');
                }
            } catch (error) {
                showNotification(`Erreur réseau: ${error.message}`, 'error');
            }
        }

        function toggleView() {
            showNotification('Fonction View à implémenter', 'error');
        }

        // Mise à jour des serveurs
        async function updateServerList() {
            try {
                const response = await fetch(`${API_URL}/api/servers`);
                const result = await response.json();
                
                const serverList = document.getElementById('serverList');
                
                if (result.success && result.servers.length > 0) {
                    serverList.innerHTML = result.servers.map(server => `
                        <div class="server-item">
                            <p><strong>Serveur ${server.serverId.substring(0, 8)}</strong></p>
                            <p>Place: ${server.placeId}</p>
                            <p>Actif: ${Math.floor((Date.now() - server.lastPing) / 1000)}s</p>
                        </div>
                    `).join('');
                } else {
                    serverList.innerHTML = `
                        <div class="server-item">
                            <p><strong>En attente...</strong></p>
                            <p>Aucun serveur connecté</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Erreur serveurs:', error);
            }
        }

        setInterval(updateServerList, 10000);
        updateServerList();

        // Sauvegarder la clé API
        const savedApiKey = localStorage.getItem('apiKey');
        if (savedApiKey) {
            document.getElementById('apiKey').value = savedApiKey;
        }

        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('apiKey', e.target.value);
        });

        // Mise à jour du nom du joueur
        document.getElementById('playerSearch').addEventListener('input', (e) => {
            const playerName = e.target.value;
            document.getElementById('playerName').textContent = playerName ? `(!) ${playerName}` : '(!) lucassss_2';
        });
    </script>
</body>
</html>
